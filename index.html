<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Тренировка</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Тренировка">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2F86DB">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#667085;
      font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:16px}
    #open{display:inline-block;margin-top:8px;padding:14px 22px;border-radius:13px;background:#27875f;color:#fff;
      font-weight:650;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <img src="apple-touch-icon.png" width="96" height="96" alt="" style="border-radius:22px">
    <p id="hint">Нажмите «Поделиться» → «На экран Домой», чтобы добавить ярлык.</p>
    <a id="open" href="#">Открыть тренировку</a>
  </main>
  <script>
    // URL развёртывания Apps Script (заканчивается на /exec). Заменить перед публикацией.
    const EXEC_URL = 'https://script.google.com/macros/s/ВСТАВЬТЕ_ID_РАЗВЕРТЫВАНИЯ/exec';
    document.getElementById('open').href = EXEC_URL;
    // С ярлыка на экране «Домой» сразу уходим в приложение.
    // В обычном Safari остаёмся на странице, чтобы iOS прочитала иконку.
    const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    if (standalone) {
      document.getElementById('hint').textContent = 'Открываю тренировку…';
      location.replace(EXEC_URL);
    }
  </script>
</body>
</html>
